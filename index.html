<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>酒馆·角色时光机</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(145deg, #1a1c2e 0%, #2a2d44 100%);
            font-family: 'Segoe UI', system-ui, -apple-system, 'Inter', sans-serif;
            padding: 20px;
            min-height: 100vh;
            color: #f0f3fa;
        }

        /* 主容器 */
        .container {
            max-width: 1300px;
            margin: 0 auto;
        }

        /* 头部区域 */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            margin-bottom: 28px;
            gap: 15px;
            background: rgba(15, 20, 40, 0.5);
            backdrop-filter: blur(10px);
            padding: 16px 24px;
            border-radius: 48px;
            border: 1px solid rgba(255,255,255,0.2);
        }

        h1 {
            font-size: 1.9rem;
            background: linear-gradient(135deg, #FFD166, #FF6B6B);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: 1px;
        }

        .actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        button {
            background: #3b3f5c;
            border: none;
            padding: 10px 20px;
            border-radius: 40px;
            font-weight: bold;
            color: white;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            backdrop-filter: blur(4px);
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }

        button.primary {
            background: #ff6b6b;
            box-shadow: 0 0 8px rgba(255,107,107,0.5);
        }

        button.primary:hover {
            background: #ff5252;
            transform: scale(0.97);
        }

        button:hover {
            transform: translateY(-2px);
            filter: brightness(1.05);
        }

        /* 角色网格 */
        .char-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 24px;
            margin-bottom: 40px;
        }

        .char-card {
            background: rgba(30, 35, 58, 0.7);
            backdrop-filter: blur(12px);
            border-radius: 36px;
            padding: 20px 12px 16px;
            text-align: center;
            cursor: pointer;
            transition: all 0.25s;
            border: 1px solid rgba(255,255,255,0.15);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }

        .char-card:hover {
            transform: translateY(-8px);
            background: rgba(45, 50, 78, 0.9);
            border-color: #ffaa66;
        }

        .char-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            margin: 0 auto 12px;
            display: block;
            border: 3px solid #ffd966;
            box-shadow: 0 4px 12px black;
            background: #1e1f2c;
        }

        .char-name {
            font-size: 1.3rem;
            font-weight: bold;
            margin: 8px 0 4px;
        }

        .char-count {
            font-size: 0.7rem;
            opacity: 0.7;
        }

        /* 弹窗样式 */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(5px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-card {
            background: #222640;
            border-radius: 48px;
            max-width: 500px;
            width: 90%;
            padding: 24px;
            border: 1px solid rgba(255,215,0,0.4);
            box-shadow: 0 25px 40px black;
            animation: fadeIn 0.2s ease;
        }

        .modal-card input, .modal-card textarea, .modal-card select {
            width: 100%;
            margin: 8px 0 16px;
            padding: 12px;
            border-radius: 32px;
            border: none;
            background: #2f334d;
            color: white;
            font-size: 1rem;
        }

        .record-item {
            background: rgba(0,0,0,0.3);
            border-radius: 32px;
            padding: 16px;
            margin-bottom: 16px;
            border-left: 6px solid #ffaa66;
        }

        .record-date {
            font-size: 0.8rem;
            color: #ffcc88;
            margin-bottom: 6px;
        }

        .back-btn {
            background: #5f6390;
            margin-bottom: 20px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.96);}
            to { opacity: 1; transform: scale(1);}
        }

        .flex-between {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .empty-tip {
            opacity: 0.6;
            text-align: center;
            padding: 40px;
        }
    </style>
</head>
<body>
<div class="container" id="app">
    <!-- 头部 -->
    <div class="header">
        <h1>🎭 酒馆·角色时光机</h1>
        <div class="actions">
            <button id="lotteryBtn">🎲 抽签 · 今日翻牌</button>
            <button id="addCharBtn" class="primary">✨ + 新角色</button>
        </div>
    </div>

    <!-- 角色列表区 -->
    <div id="charList" class="char-grid"></div>
</div>

<!-- 弹窗：新增角色 -->
<div id="charModal" class="modal">
    <div class="modal-card">
        <h2>📖 新建角色</h2>
        <input type="text" id="charName" placeholder="角色名字 (例如: 薛寻之)">
        <input type="text" id="charImg" placeholder="图片链接 (图床URL 或 网络图片地址)">
        <div style="display: flex; gap: 12px; margin-top: 12px;">
            <button id="saveCharBtn">✅ 保存角色</button>
            <button id="closeCharModal">❌ 取消</button>
        </div>
    </div>
</div>

<!-- 弹窗：添加时光记录 -->
<div id="recordModal" class="modal">
    <div class="modal-card">
        <h2>📝 添加时光记录</h2>
        <input type="date" id="recordDate">
        <textarea id="recordText" rows="3" placeholder="写点什么… 聊天感悟 / 经典对话 / 小剧场"></textarea>
        <div style="display: flex; gap: 12px;">
            <button id="submitRecordBtn">📀 保存记录</button>
            <button id="closeRecordModal">🔙 取消</button>
        </div>
    </div>
</div>

<script>
    // ---------- 存储结构 ----------
    let characters = [];     // { id, name, img, records: [{ date, content }] }

    // 初始化示例数据 (避免空荡荡)
    function initSampleData() {
        if (localStorage.getItem('characters_v2')) return;
        const sample = [
            { id: Date.now()+1, name: "薛寻之", img: "https://picsum.photos/id/100/200/200", records: [{ date: "2025-03-20", content: "今天聊了职场规则，他真的很现实但又有底线。" }] },
            { id: Date.now()+2, name: "苏知夏", img: "https://picsum.photos/id/64/200/200", records: [{ date: "2025-03-18", content: "神秘又洒脱，一句话把我噎住，爱了。" }] }
        ];
        localStorage.setItem('characters_v2', JSON.stringify(sample));
    }

    function loadData() {
        const raw = localStorage.getItem('characters_v2');
        if (raw) characters = JSON.parse(raw);
        else characters = [];
        renderCharGrid();
    }

    function saveToLocal() {
        localStorage.setItem('characters_v2', JSON.stringify(characters));
    }

    // 渲染角色网格 (首页)
    function renderCharGrid() {
        const container = document.getElementById('charList');
        if (!characters.length) {
            container.innerHTML = `<div class="empty-tip">✨ 还没有角色，点击「+ 新角色」开启你的酒馆时光机 ✨</div>`;
            return;
        }
        container.innerHTML = characters.map(char => `
            <div class="char-card" data-id="${char.id}">
                <img class="char-avatar" src="${char.img || 'https://picsum.photos/id/26/200/200'}" onerror="this.src='https://picsum.photos/id/27/200/200'">
                <div class="char-name">${escapeHtml(char.name)}</div>
                <div class="char-count">📅 ${char.records?.length || 0} 段回忆</div>
            </div>
        `).join('');
        // 绑定点击事件查看详情
        document.querySelectorAll('.char-card').forEach(card => {
            card.addEventListener('click', (e) => {
                const id = parseInt(card.dataset.id);
                showCharDetail(id);
            });
        });
    }

    // 展示角色详情页 (替换当前视图)
    let currentDetailId = null;
    function showCharDetail(charId) {
        const char = characters.find(c => c.id === charId);
        if (!char) return;
        currentDetailId = charId;
        const container = document.getElementById('app');
        // 构建详情HTML
        const recordsHtml = (char.records || []).slice().reverse().map(rec => `
            <div class="record-item">
                <div class="record-date">📆 ${rec.date || '未标注日期'}</div>
                <div>${escapeHtml(rec.content)}</div>
            </div>
        `).join('');
        const emptyRecords = (!char.records || char.records.length === 0) ? '<div class="empty-tip">暂无时光记录，点击下方按钮添加第一条~</div>' : '';
        
        const detailHtml = `
            <div class="flex-between" style="margin-bottom: 20px;">
                <button class="back-btn" id="backHomeBtn">← 返回酒馆大厅</button>
                <button id="addRecordForCharBtn" class="primary">➕ 添加时光记录</button>
            </div>
            <div style="background: #2a2e48; border-radius: 48px; padding: 24px; margin-bottom: 28px; text-align: center;">
                <img src="${char.img || 'https://picsum.photos/id/26/200/200'}" style="width: 120px; height: 120px; border-radius: 60px; object-fit: cover; border: 3px solid gold;">
                <h2 style="margin: 16px 0 4px;">${escapeHtml(char.name)}</h2>
                <div style="opacity:0.7;">📜 专属回忆录</div>
            </div>
            <h3>📌 时光剪影</h3>
            ${emptyRecords}
            <div id="recordsList">${recordsHtml}</div>
        `;
        container.innerHTML = detailHtml;
        // 重新绑定事件
        document.getElementById('backHomeBtn').addEventListener('click', () => {
            renderCharGrid();
            rebuildHomeView();
        });
        document.getElementById('addRecordForCharBtn').addEventListener('click', () => {
            openRecordModal(charId);
        });
    }

    function rebuildHomeView() {
        const container = document.getElementById('app');
        container.innerHTML = `
            <div class="header">
                <h1>🎭 酒馆·角色时光机</h1>
                <div class="actions">
                    <button id="lotteryBtn">🎲 抽签 · 今日翻牌</button>
                    <button id="addCharBtn" class="primary">✨ + 新角色</button>
                </div>
            </div>
            <div id="charList" class="char-grid"></div>
        `;
        renderCharGrid();
        document.getElementById('lotteryBtn').addEventListener('click', lotteryDraw);
        document.getElementById('addCharBtn').addEventListener('click', () => openCharModal());
    }

    // 抽签逻辑
    function lotteryDraw() {
        if (characters.length === 0) {
            alert("还没有角色，请先添加～");
            return;
        }
        const randomIdx = Math.floor(Math.random() * characters.length);
        const lucky = characters[randomIdx];
        const userConfirm = confirm(`✨ 今日翻牌：${lucky.name} ✨\n要不要现在去查看它的回忆？\n「确定」前往 / 「取消」再抽一次`);
        if (userConfirm) {
            showCharDetail(lucky.id);
        } else {
            lotteryDraw();
        }
    }

    // 新增角色弹窗
    function openCharModal() {
        const modal = document.getElementById('charModal');
        document.getElementById('charName').value = '';
        document.getElementById('charImg').value = '';
        modal.style.display = 'flex';
        const save = document.getElementById('saveCharBtn');
        const close = document.getElementById('closeCharModal');
        const closeHandler = () => modal.style.display = 'none';
        save.onclick = () => {
            const name = document.getElementById('charName').value.trim();
            const img = document.getElementById('charImg').value.trim();
            if (!name) { alert("名字不能为空"); return; }
            const newChar = {
                id: Date.now(),
                name: name,
                img: img || 'https://picsum.photos/id/42/200/200',
                records: []
            };
            characters.push(newChar);
            saveToLocal();
            modal.style.display = 'none';
            renderCharGrid();
            alert(`✨ 角色「${name}」加入酒馆！`);
        };
        close.onclick = closeHandler;
        // 移除旧监听避免重复
        modal.onclick = (e) => { if(e.target === modal) closeHandler(); };
    }

    // 打开记录弹窗 (关联角色)
    let activeCharIdForRecord = null;
    function openRecordModal(charId) {
        activeCharIdForRecord = charId;
        const modal = document.getElementById('recordModal');
        const today = new Date().toISOString().slice(0,10);
        document.getElementById('recordDate').value = today;
        document.getElementById('recordText').value = '';
        modal.style.display = 'flex';
        
        const submit = document.getElementById('submitRecordBtn');
        const closeRec = document.getElementById('closeRecordModal');
        const submitHandler = () => {
            const date = document.getElementById('recordDate').value;
            const content = document.getElementById('recordText').value.trim();
            if (!content) { alert("记录内容不能为空～"); return; }
            const charIndex = characters.findIndex(c => c.id === activeCharIdForRecord);
            if (charIndex === -1) return;
            if (!characters[charIndex].records) characters[charIndex].records = [];
            characters[charIndex].records.push({ date: date || new Date().toISOString().slice(0,10), content });
            saveToLocal();
            modal.style.display = 'none';
            if (currentDetailId === activeCharIdForRecord) showCharDetail(activeCharIdForRecord);
            else renderCharGrid();
            alert("📀 回忆已封存");
        };
        submit.onclick = submitHandler;
        closeRec.onclick = () => modal.style.display = 'none';
        modal.onclick = (e) => { if(e.target === modal) modal.style.display = 'none'; };
    }

    function escapeHtml(str) {
        if(!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if(m === '&') return '&amp;';
            if(m === '<') return '&lt;';
            if(m === '>') return '&gt;';
            return m;
        }).replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]/g, function(c) {
            return c;
        });
    }

    // 初始化数据 & 绑定首页事件
    initSampleData();
    loadData();
    // 绑定全局抽签和新角色（首页）
    document.getElementById('lotteryBtn')?.addEventListener('click', lotteryDraw);
    document.getElementById('addCharBtn')?.addEventListener('click', () => openCharModal());
</script>
</body>
</html>
